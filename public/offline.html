<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E293B">
<title>Phone Buzz — offline</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #1E293B; color: #F8FAFC;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 22px; }
  h1 { font-size: 20px; margin: 18px 0 8px; }
  p { color: #CBD5E1; font-size: 14px; max-width: 300px; margin: 0 auto 20px; line-height: 1.5; }
  button { background: #F97316; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Phone Buzz">
    <h1>No internet connection</h1>
    <p>Phone Buzz Dashboard needs the internet to show live chats and orders. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
